<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كوكي و ملاكي ❤️ ذكرياتنا</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#2b0b1f,#4a1030,#7b1e3c,#2b0b1f);
    color:#fff;
    overflow-x:hidden;
  }
  .hearts { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .heart {
    position:absolute; bottom:-40px;
    color:#ff6b8a; opacity:.7;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform:translateY(0) scale(.8); opacity:0; }
    15% { opacity:.85; }
    100% { transform:translateY(-110vh) scale(1.3); opacity:0; }
  }
  .wrap {
    position:relative; z-index:2;
    max-width:900px; margin:0 auto;
    padding:40px 16px 80px;
    text-align:center;
  }
  .cover {
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,182,193,.35);
    border-radius:28px;
    padding:50px 24px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
  }
  .book-title {
    font-family:'Amiri',serif;
    font-size:clamp(38px,8vw,72px);
    color:#ffd6e0;
    text-shadow:0 0 25px rgba(255,107,138,.55);
  }
  .names {
    font-size:clamp(22px,5vw,36px);
    margin-top:12px;
    color:#fff;
  }
  .names span { color:#ff9db1; font-weight:800; }
  .subtitle {
    margin-top:18px; font-size:17px; opacity:.85; line-height:2;
  }
  .btn {
    display:inline-block; margin-top:28px;
    background:linear-gradient(135deg,#ff6b8a,#ff2e63);
    color:#fff; border:none; cursor:pointer;
    padding:14px 34px; border-radius:50px;
    font-family:'Cairo'; font-size:18px; font-weight:700;
    box-shadow:0 12px 30px rgba(255,46,99,.45);
    transition:.25s;
  }
  .btn:hover { transform:translateY(-3px) scale(1.03); }

  .book {
    display:none; margin-top:40px;
    perspective:1600px;
  }
  .page {
    background:linear-gradient(180deg,#fff7f9,#ffe9ef);
    color:#5b2333;
    border-radius:22px;
    padding:28px 22px;
    min-height:520px;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
    display:none;
    animation:pageIn .6s ease;
  }
  .page.active { display:block; }
  @keyframes pageIn {
    from { opacity:0; transform:rotateY(-18deg) translateX(40px); }
    to { opacity:1; transform:none; }
  }
  .page h2 {
    font-family:'Amiri',serif;
    color:#b3123f;
    font-size:clamp(26px,5vw,40px);
    margin-bottom:10px;
  }
  .page p {
    font-size:17px; line-height:2;
    margin-bottom:18px;
    white-space:pre-line;
  }
  .photo-slot {
    width:100%; max-width:420px; margin:14px auto;
    aspect-ratio:4/3;
    border:3px dashed #ff8fa8;
    border-radius:18px;
    background:#fff0f4;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
    position:relative;
    transition:.25s;
  }
  .photo-slot:hover { transform:scale(1.02); }
  .photo-slot img {
    width:100%; height:100%; object-fit:cover;
  }
  .photo-slot span {
    color:#c94f68; font-weight:700; font-size:15px;
  }
  .page-controls {
    margin-top:26px;
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  .nav-btn {
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,182,193,.4);
    color:#fff; padding:11px 24px; border-radius:50px;
    cursor:pointer; font-family:'Cairo'; font-size:16px;
    transition:.25s;
  }
  .nav-btn:hover { background:#ff2e63; border-color:#ff2e63; }
  .page-dots {
    margin-top:18px; display:flex; gap:8px; justify-content:center;
  }
  .dot {
    width:11px; height:11px; border-radius:50%;
    background:rgba(255,255,255,.35); cursor:pointer;
  }
  .dot.active { background:#ff6b8a; transform:scale(1.25); }

  .add-page {
    margin-top:30px;
    background:rgba(255,255,255,.1);
    border:1px dashed rgba(255,182,193,.5);
    color:#ffd6e0;
    padding:16px 26px; border-radius:18px; cursor:pointer;
    font-family:'Cairo'; font-size:16px;
  }
  .add-page:hover { background:rgba(255,46,99,.25); }

  input, textarea {
    width:100%; max-width:520px;
    padding:12px 16px; margin:8px auto;
    border-radius:14px; border:1px solid #ffb6c1;
    font-family:'Cairo'; font-size:16px;
    display:block; background:#fff8fa; color:#5b2333;
  }
  textarea { min-height:120px; resize:vertical; }
  .small { font-size:13px; opacity:.75; margin-top:6px; }
  .love-note {
    margin-top:34px;
    font-family:'Amiri',serif;
    font-size:20px; color:#ffd6e0;
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="wrap">

  <!-- الغلاف -->
  <section class="cover" id="cover">
    <div class="book-title">📖 ذكرياتنا</div>
    <div class="names">
      <span>كوكي</span> &amp; <span>ملاكي</span>
    </div>
    <p class="subtitle">
      كل صفحة هنا فيها حكاية،<br>
      وكل ذكرى فيها حبك يا <b>ملاكي</b> ❤️
    </p>
    <button class="btn" onclick="openBook()">افتح الكتاب ❤️</button>
    <p class="love-note">من كوكي إلى ملاكي… بحبك دايمًا.</p>
  </section>

  <!-- الكتاب -->
  <section class="book" id="book">
    <div id="pages"></div>

    <div class="page-controls">
      <button class="nav-btn" onclick="prevPage()">⬅️ الصفحة السابقة</button>
      <button class="nav-btn" onclick="nextPage()">الصفحة التالية ➡️</button>
    </div>

    <div class="page-dots" id="dots"></div>

    <button class="add-page" onclick="addMemoryPage()">➕ أضف ذكرى جديدة</button>
    <p class="small">الصور والكلام بيتحفظوا في متصفحك، فممكن ترجع تلاقيهم بعد ما تقفل الموقع.</p>
  </section>

</div>

<script>
const pagesData = JSON.parse(localStorage.getItem('cokyMalakyPages') || 'null') || [
  {
    title: "بداية حكايتنا",
    text: "يا ملاكي،\nكل حاجة حلوة في حياتي بدأت لما دخلك قلبي.\nالصفحة دي أول ذكرى لينا… ويا رب نبقى نكتب مع بعض آلاف الصفحات.",
    image: ""
  },
  {
    title: "أجمل أيامنا",
    text: "فيه لحظات بسيطة، بس معاكي بقت أحلى حاجة.\nضحكتك، كلامك، وجودك… كلهم ذكرى بتحب أرجع لها.",
    image: ""
  },
  {
    title: "رسالة لِ ملاكي",
    text: "ملاكي،\nأنتِ مش بس حبيبتي، أنتِ راحتي ودلعي وسكينتي.\nوأنا كوكي… هفضل أحبك وأخليك مبسوطة إن شاء الله ❤️",
    image: ""
  }
];

let currentPage = 0;
const pagesEl = document.getElementById('pages');
const dotsEl = document.getElementById('dots');

function save() {
  localStorage.setItem('cokyMalakyPages', JSON.stringify(pagesData));
}

function createHearts() {
  const box = document.getElementById('hearts');
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '❤';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (12 + Math.random() * 26) + 'px';
    h.style.animationDuration = (7 + Math.random() * 9) + 's';
    h.style.animationDelay = (Math.random() * 10) + 's';
    box.appendChild(h);
  }
}

function openBook() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('book').style.display = 'block';
  renderPages();
}

function renderPages() {
  pagesEl.innerHTML = '';
  dotsEl.innerHTML = '';

  pagesData.forEach((p, i) => {
    const page = document.createElement('div');
    page.className = 'page' + (i === currentPage ? ' active' : '');

    page.innerHTML = `
      <h2>${escapeHTML(p.title)}</h2>
      <div class="photo-slot" onclick="pickImage(${i})">
        ${p.image ? `<img src="${p.image}" alt="ذكرى">` : `<span>📷 اضغط هنا وحط صورة الذكرى</span>`}
      </div>
      <p>${escapeHTML(p.text)}</p>
      <button class="nav-btn" style="background:#b3123f;border:none" onclick="editPage(${i})">✏️ تعديل الصفحة</button>
    `;
    pagesEl.appendChild(page);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentPage ? ' active' : '');
    dot.onclick = () => goToPage(i);
    dotsEl.appendChild(dot);
  });
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function pickImage(i) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      pagesData[i].image = ev.target.result;
      save();
      renderPages();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function editPage(i) {
  const title = prompt('عنوان الذكرى:', pagesData[i].title);
  if (title === null) return;
  const text = prompt('اكتب كلامك الرومانسي هنا:', pagesData[i].text);
  if (text === null) return;
  pagesData[i].title = title || pagesData[i].title;
  pagesData[i].text = text || pagesData[i].text;
  save();
  renderPages();
}

function addMemoryPage() {
  const title = prompt('عنوان الذكرى الجديدة:', 'ذكرى جديدة ❤️');
  if (title === null) return;
  const text = prompt('اكتب الذكرى أو رسالتك:', 'يا ملاكي، الذكرى دي خاصة بينا…');
  if (text === null) return;
  pagesData.push({ title: title || 'ذكرى جديدة ❤️', text: text || '', image: '' });
  currentPage = pagesData.length - 1;
  save();
  renderPages();
}

function nextPage() {
  if (currentPage < pagesData.length - 1) {
    currentPage++;
    renderPages();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPages();
  }
}

function goToPage(i) {
  currentPage = i;
  renderPages();
}

createHearts();
</script>

</body>
</html>
